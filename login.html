<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · Ferretería</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class' };
</script>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="min-h-full bg-gradient-to-br from-slate-50 via-blue-50 to-violet-100 dark:from-[#0b0b0f] dark:via-[#0f1020] dark:to-[#1a1030] flex items-center justify-center p-4">

<button id="themeToggle" aria-label="Cambiar tema"
  class="fixed top-4 right-4 w-11 h-11 rounded-full glass flex items-center justify-center transition hover:scale-105 active:scale-95">
  <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="w-full max-w-md">
  <div class="text-center mb-8 animate-spring">
    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center shadow-2xl shadow-blue-500/30 mb-4">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight">Ferretería</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-1">Sistema de comisiones</p>
  </div>

  <div class="glass-card p-6 animate-spring">
    <div class="flex bg-slate-100/70 dark:bg-slate-800/60 rounded-2xl p-1 mb-6">
      <button id="tabLogin" class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all bg-white dark:bg-slate-700 shadow-sm">Iniciar sesión</button>
      <button id="tabRegistro" class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all text-slate-500 dark:text-slate-400">Registrarse</button>
    </div>

    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Usuario</label>
        <input name="usuario" required autocomplete="username"
          class="input-ios" placeholder="tu usuario">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Contraseña</label>
        <input name="password" type="password" required autocomplete="current-password"
          class="input-ios" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary w-full">Entrar</button>
    </form>

    <form id="formRegistro" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Nombre completo</label>
        <input name="nombre" required class="input-ios" placeholder="Juan Pérez">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Usuario</label>
        <input name="usuario" required class="input-ios" placeholder="juanp">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wide">Contraseña</label>
        <input name="password" type="password" required minlength="6" class="input-ios" placeholder="Mínimo 6 caracteres">
      </div>
      <button type="submit" class="btn-primary w-full">Crear cuenta</button>
      <p class="text-xs text-center text-slate-500 dark:text-slate-400">
        Tu cuenta quedará pendiente hasta que el administrador la active.
      </p>
    </form>

    <div id="loginMsg" class="mt-4 text-sm text-center hidden"></div>
  </div>

  <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6">
    Demo: admin / admin123 · carlos / carlos123 · maria / maria123
  </p>
</div>

<script>
const root = document.documentElement;
const saved = localStorage.getItem('theme');
if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  root.classList.add('dark');
}
function updateIcons() {
  const dark = root.classList.contains('dark');
  document.getElementById('iconSun').classList.toggle('hidden', !dark);
  document.getElementById('iconMoon').classList.toggle('hidden', dark);
}
updateIcons();
document.getElementById('themeToggle').onclick = () => {
  root.classList.toggle('dark');
  localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
  updateIcons();
};

const tabLogin = document.getElementById('tabLogin');
const tabRegistro = document.getElementById('tabRegistro');
const formLogin = document.getElementById('formLogin');
const formRegistro = document.getElementById('formRegistro');

function setTab(login) {
  if (login) {
    tabLogin.classList.add('bg-white','dark:bg-slate-700','shadow-sm');
    tabLogin.classList.remove('text-slate-500','dark:text-slate-400');
    tabRegistro.classList.remove('bg-white','dark:bg-slate-700','shadow-sm');
    tabRegistro.classList.add('text-slate-500','dark:text-slate-400');
    formLogin.classList.remove('hidden');
    formRegistro.classList.add('hidden');
  } else {
    tabRegistro.classList.add('bg-white','dark:bg-slate-700','shadow-sm');
    tabRegistro.classList.remove('text-slate-500','dark:text-slate-400');
    tabLogin.classList.remove('bg-white','dark:bg-slate-700','shadow-sm');
    tabLogin.classList.add('text-slate-500','dark:text-slate-400');
    formRegistro.classList.remove('hidden');
    formLogin.classList.add('hidden');
  }
}
tabLogin.onclick = () => setTab(true);
tabRegistro.onclick = () => setTab(false);

function showMsg(text, type='error') {
  const el = document.getElementById('loginMsg');
  el.className = 'mt-4 text-sm text-center px-3 py-2 rounded-xl ' +
    (type === 'error' ? 'bg-red-500/10 text-red-600 dark:text-red-400' :
     type === 'success' ? 'bg-green-500/10 text-green-600 dark:text-green-400' :
     'bg-blue-500/10 text-blue-600 dark:text-blue-400');
  el.textContent = text;
  el.classList.remove('hidden');
}

formLogin.onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(formLogin);
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(Object.fromEntries(fd))
  });
  const data = await res.json();
  if (res.ok) {
    showMsg('¡Bienvenido! Redirigiendo...', 'success');
    setTimeout(() => location.href = '/', 500);
  } else {
    showMsg(data.error || 'Error al iniciar sesión');
  }
};

formRegistro.onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(formRegistro);
  const res = await fetch('/api/auth/registro', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(Object.fromEntries(fd))
  });
  const data = await res.json();
  if (res.ok) {
    showMsg('Registro exitoso. Espera la activación del administrador.', 'success');
    formRegistro.reset();
  } else {
    showMsg(data.error || 'Error al registrarse');
  }
};
</script>
</body>
</html>
